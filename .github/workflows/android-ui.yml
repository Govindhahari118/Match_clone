name: Android UI

on:
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-ui.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-ui.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android unit tests
        run: gradle -p mobile/android test --stacktrace
