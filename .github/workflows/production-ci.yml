name: Production CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On pull_request GitHub's default github.sha is a synthetic merge commit. Production evidence
# must bind to the actual branch head that will be reviewed and promoted.
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: MatchApp
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Production truthfulness scan
        run: python3 scripts/ci/truthfulness_scan.py
      - name: Screen classification gate
        run: python3 scripts/ci/screen_classification_scan.py
      - name: Translation catalog gate
        run: python3 scripts/ci/i18n_catalog_scan.py
      - name: Chat localization gate
        run: python3 scripts/ci/chat_localization_scan.py
      - name: Discovery/preferences localization gate
        run: python3 scripts/ci/discovery_preferences_localization_scan.py
      - name: Notification localization gate
        run: python3 scripts/ci/notification_localization_scan.py
      - name: Android / Functions callable contract gate
        run: python3 scripts/ci/callable_contract_scan.py
      - name: Interest to chat journey contract gate
        run: python3 scripts/ci/interest_chat_contract_scan.py
      - name: Photo request journey contract gate
        run: python3 scripts/ci/photo_request_contract_scan.py
      - name: Conversation starter contract gate
        run: python3 scripts/ci/conversation_starter_contract_scan.py
      - name: Reporting contract gate
        run: python3 scripts/ci/reporting_contract_scan.py
      - name: Chat thread controls contract gate
        run: python3 scripts/ci/chat_thread_controls_scan.py
      - name: Profile video contract gate
        run: python3 scripts/ci/profile_video_contract_scan.py
      - name: Photo privacy contract gate
        run: python3 scripts/ci/photo_privacy_contract_scan.py
      - name: Exact-source release guard
        run: python3 scripts/ci/release_source_guard.py --sha "$SOURCE_SHA"
      - name: Release candidate repository scan
        run: python3 scripts/ci/release_candidate_scan.py
      - name: Production handoff package gate
        run: python3 scripts/ci/handoff_package_scan.py
      - name: Validate external production gate logic
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/production_external_gate.py scripts/ci/release_source_guard.py scripts/release/generate_assetlinks.py scripts/release/verify_branch_protection.py
          python3 scripts/release/generate_assetlinks.py \
            --package com.example.matree \
            --sha256 "AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA:AA" \
            --output /tmp/matree-assetlinks.json
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/matree-assetlinks.json", encoding="utf-8"))
          assert data[0]["target"]["package_name"] == "com.example.matree"
          assert data[0]["relation"] == ["delegate_permission/common.handle_all_urls"]
          PY
          if python3 scripts/ci/production_external_gate.py \
              --evidence docs/release/PRODUCTION_EXTERNAL_EVIDENCE.template.json \
              --sha "$SOURCE_SHA" --mode prelaunch; then
            echo "Template must never pass the external production gate."
            exit 1
          fi
          python3 - "$SOURCE_SHA" <<'PY'
          import importlib.util, json, pathlib, sys
          sha=sys.argv[1]
          path=pathlib.Path("scripts/ci/production_external_gate.py")
          spec=importlib.util.spec_from_file_location("production_external_gate", path)
          assert spec and spec.loader
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          data={
              "gitSha":sha,
              "evidenceType":"ci-synthetic-validator",
              "releaseOwner":"production-ci",
              "capturedAt":"2026-01-01T00:00:00Z",
              "evidence":{},
          }
          for gate in module.FULL_RELEASE_GATES:
              data[gate]=True
              data["evidence"][gate]="synthetic-ci-validator-reference"
          pathlib.Path("/tmp/matree-external-gate-synthetic.json").write_text(
              json.dumps(data), encoding="utf-8"
          )
          PY
          python3 scripts/ci/production_external_gate.py \
            --evidence /tmp/matree-external-gate-synthetic.json \
            --sha "$SOURCE_SHA" --mode full --allow-ci-synthetic
          if python3 scripts/ci/production_external_gate.py \
              --evidence /tmp/matree-external-gate-synthetic.json \
              --sha "$SOURCE_SHA" --mode prelaunch; then
            echo "CI synthetic validator must be rejected without the explicit self-test flag."
            exit 1
          fi
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Generate and validate current Room schema evidence
        shell: bash
        run: |
          set -euo pipefail
          # Room schema export is a KSP side effect and is not reliably restored by Gradle task cache.
          # Force execution so exact-SHA evidence never depends on a prior runner workspace/cache hit.
          ./gradlew --no-daemon --rerun-tasks kspDebugKotlin
          python3 scripts/ci/room_schema_evidence.py
      - name: Android lint
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon lintDebug
          status=$?
          if [ "$status" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            echo "---- full Android lint report ----"
            if [ -f "$report" ]; then cat "$report"; else echo "Lint text report was not produced"; fi
            echo "---- end Android lint report ----"
          fi
          exit "$status"
      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug
      - name: Non-production release bundle / R8 validation
        shell: bash
        run: |
          set -euo pipefail
          cleanup=0
          if [ ! -f app/src/release/google-services.json ] && [ ! -f app/google-services.json ]; then
            mkdir -p app/src/release
            cp app/src/debug/google-services.json app/src/release/google-services.json
            cleanup=1
            echo "Using DEBUG-ONLY placeholder Firebase config strictly for compile/R8 validation."
            echo "This AAB is NOT a production release candidate."
          fi
          trap 'if [ "$cleanup" -eq 1 ]; then rm -f app/src/release/google-services.json; fi' EXIT
          ./gradlew --no-daemon bundleRelease
          python3 scripts/ci/release_candidate_scan.py --merged-manifest app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          python3 scripts/ci/release_artifact_audit.py app/build/outputs/bundle/release/*.aab
          if [ "$cleanup" -eq 1 ]; then
            rm -f app/build/outputs/bundle/release/*.aab
            cat > app/build/outputs/bundle/release/NON_PRODUCTION_FIREBASE_CONFIG.txt <<EOF
          SHA: ${SOURCE_SHA}
          Release/R8 code validation used the debug-only placeholder Firebase configuration.
          No production AAB is emitted until a real release google-services.json is supplied.
          EOF
          fi
      - name: Generate exact-SHA release evidence
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/release_evidence.py             --sha "$SOURCE_SHA"             --output app/build/outputs/bundle/release/RELEASE_EVIDENCE.md
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-code-evidence-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            MatchApp/app/build/test-results/testDebugUnitTest/**
            MatchApp/app/build/reports/tests/testDebugUnitTest/**
            MatchApp/app/build/reports/lint-results-debug.*
            MatchApp/app/build/intermediates/lint_intermediate_text_report/debug/**
            MatchApp/app/build/outputs/apk/debug/*.apk
            MatchApp/app/build/outputs/bundle/release/*.aab
            MatchApp/app/build/outputs/bundle/release/*.txt
            MatchApp/app/build/outputs/mapping/release/**
            MatchApp/app/build/outputs/room-schema/**


  room-migrations:
    name: Room migration and privacy instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MatchApp
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-35;google_apis;x86_64"
      - name: Run supported Room upgrades and screen-privacy instrumentation
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name matree-ci-api35 \
            --package "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/matree-ci-api35.ini"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          "$ANDROID_HOME/emulator/emulator" \
            -avd matree-ci-api35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -accel on \
            -gpu swiftshader_indirect \
            -cores 2 \
            -memory 2048 \
            -camera-back none \
            -camera-front none >/tmp/matree-emulator.log 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          if ! timeout 120 "$ADB" wait-for-device; then
            cat /tmp/matree-emulator.log || true
            exit 1
          fi
          if ! timeout 180 bash -c 'until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'; then
            cat /tmp/matree-emulator.log || true
            "$ADB" devices -l || true
            exit 1
          fi
          "$ADB" shell input keyevent 82 || true
          ./gradlew --no-daemon connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.match.app.data.local.MatchDatabaseMigrationTest,com.match.app.security.ScreenCaptureProtectionTest
      - name: Upload Room/privacy instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-privacy-instrumentation-evidence-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            MatchApp/app/build/reports/androidTests/connected/**
            MatchApp/app/build/outputs/androidTest-results/connected/**
            /tmp/matree-emulator.log

  functions:
    name: Firebase Functions lint, build and production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MatchApp/functions
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: MatchApp/functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Validate operator console assets
        shell: bash
        run: |
          test -f ../ops-console/index.html
          test -f ../ops-console/styles.css
          test -f ../ops-console/app.js
          node --check ../ops-console/app.js
          grep -q 'app.js' ../ops-console/index.html
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > production-audit.json
          status=$?
          cat production-audit.json
          exit "$status"
      - name: Upload Functions evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-evidence-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            MatchApp/functions/lib/**
            MatchApp/functions/production-audit.json

  firebase-rules:
    name: Firestore and Storage security rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MatchApp/rules-tests
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Firebase emulator security tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee rules-test.log
      - name: Upload rules evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-evidence-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: MatchApp/rules-tests/rules-test.log
