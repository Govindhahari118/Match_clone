name: Production CI

on:
  push:
    branches: [Gpt_matree]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: MatchApp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Production truthfulness scan
        run: python3 scripts/ci/truthfulness_scan.py
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Android lint
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon lintDebug
          status=$?
          if [ "$status" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            echo "---- full Android lint report ----"
            if [ -f "$report" ]; then cat "$report"; else echo "Lint text report was not produced"; fi
            echo "---- end Android lint report ----"
          fi
          exit "$status"
      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug
      - name: Non-production release bundle / R8 validation
        shell: bash
        run: |
          set -euo pipefail
          cleanup=0
          if [ ! -f app/src/release/google-services.json ] && [ ! -f app/google-services.json ]; then
            mkdir -p app/src/release
            cp app/src/debug/google-services.json app/src/release/google-services.json
            cleanup=1
            echo "Using DEBUG-ONLY placeholder Firebase config strictly for compile/R8 validation."
            echo "This AAB is NOT a production release candidate."
          fi
          trap 'if [ "$cleanup" -eq 1 ]; then rm -f app/src/release/google-services.json; fi' EXIT
          ./gradlew --no-daemon bundleRelease
          if [ "$cleanup" -eq 1 ]; then
            rm -f app/build/outputs/bundle/release/*.aab
            cat > app/build/outputs/bundle/release/NON_PRODUCTION_FIREBASE_CONFIG.txt <<EOF
          SHA: ${GITHUB_SHA}
          Release/R8 code validation used the debug-only placeholder Firebase configuration.
          No production AAB is emitted until a real release google-services.json is supplied.
          EOF
          fi
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-code-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            MatchApp/app/build/test-results/testDebugUnitTest/**
            MatchApp/app/build/reports/tests/testDebugUnitTest/**
            MatchApp/app/build/reports/lint-results-debug.*
            MatchApp/app/build/intermediates/lint_intermediate_text_report/debug/**
            MatchApp/app/build/outputs/apk/debug/*.apk
            MatchApp/app/build/outputs/bundle/release/*.aab
            MatchApp/app/build/outputs/mapping/release/**

  functions:
    name: Firebase Functions lint, build and production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MatchApp/functions
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: MatchApp/functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > production-audit.json
          status=$?
          cat production-audit.json
          exit "$status"
      - name: Upload Functions evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            MatchApp/functions/lib/**
            MatchApp/functions/production-audit.json

  firebase-rules:
    name: Firestore and Storage security rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MatchApp/rules-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Firebase emulator security tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee rules-test.log
      - name: Upload rules evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: MatchApp/rules-tests/rules-test.log
