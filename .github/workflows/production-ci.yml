name: Production CI

on:
  push:
    branches: [Gpt_matree]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: MatchApp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Android lint
        run: ./gradlew --no-daemon lintDebug
      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug
      - name: Release bundle / R8 validation
        run: ./gradlew --no-daemon bundleRelease

  functions:
    name: Firebase Functions lint, build and production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MatchApp/functions
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: MatchApp/functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  firebase-rules:
    name: Firestore and Storage security rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MatchApp/rules-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Firebase emulator security tests
        run: npm test
