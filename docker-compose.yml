# ============================================================================
# MATRIMONY APP - DOCKER COMPOSE FOR LOCAL DEVELOPMENT
# Spin up PostgreSQL, Redis, and the app locally
# Usage: docker-compose up
# ============================================================================

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: matrimony-postgres
    environment:
      POSTGRES_USER: matrimony_user
      POSTGRES_PASSWORD: matrimony_dev_pass
      POSTGRES_DB: matrimony_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrimony_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: matrimony-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build: ./backend
    container_name: matrimony-api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://matrimony_user:matrimony_dev_pass@postgres:5432/matrimony_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_key_change_in_prod
      RAZORPAY_API_KEY: rzp_test_xxxxxxxx
      AWS_ACCESS_KEY_ID: your_aws_key
      AWS_SECRET_ACCESS_KEY: your_aws_secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: matrimony-network
